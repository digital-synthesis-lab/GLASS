[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "glass"
version = "0.1.0"
description = "GLASS: generative inversion of spectroscopic data into amorphous atomic structures with score-based diffusion models."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Jiawei Guo" },
    { name = "Daniel Schwalbe-Koda", email = "dskoda@ucla.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "ase>=3.23",
    "click>=8",
    "lightning>=2.0",
    "numba>=0.59",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "tensorboard>=2.12",
    "torch>=2.0",
    "torch-geometric>=2.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = [
    "matplotlib>=3.6",
    "pillow>=9",
]
hpo = ["optuna>=3.5"]

[project.urls]
Preprint = "https://arxiv.org/abs/2603.23210"

[project.scripts]
glass = "glass.cli:glass"

[tool.setuptools.packages.find]
where = ["."]
include = ["glass*"]

[tool.setuptools.package-data]
glass = ["default_params.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]
